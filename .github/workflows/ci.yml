name: crossing-pipeline
on: [push, pull_request]
permissions:
  contents: read
jobs:
  fixture-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/check_public_files.py --tracked
      - run: python scripts/build.py --fixture
      - run: python scripts/test_dashboard.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dbt-build-evidence
          path: |
            target/manifest.json
            target/build_run_results.json
            target/catalog.json
